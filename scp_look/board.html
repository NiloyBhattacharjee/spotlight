<!doctype html>
<html lang="en">
  <body style="margin: 0">
    <script type="module">
      // Look board for the SCP reels, drawn from SCP-552's real script: its number and class, the containment
      // line redacted, the first spoken line, the photo of his cell's TV, how far ahead he sees, and a stamp.
      import { page } from "KIT";
      import look from "LOOK";

      page((ctx, t, m) => {
        const l = look.make(ctx, t, m);
        l.surface();
        l.title("SCP-552", { at: 0.2 });
        l.label("Object class: Safe", 0.1, 0.165, { at: 0.8, tone: "accent" });
        l.label("Special containment procedures:", 0.1, 0.215, { at: 1.1, size: 30, tone: "muted" });
        l.redact(0.1, 0.25, 0.62, { at: 1.5, size: 34 });
        l.redact(0.1, 0.28, 0.44, { at: 1.65, size: 34 });
        l.node(0.9, 0.12, 22, { at: 0.5 });
        l.line("The TV in his room only plays old footage of that same room.", 0.1, 0.34, { at: 2.0, end: 4.4 });
        l.box(0.58, 0.67, 0.32, 0.14, { at: 3.2 });
        l.label("Fig. 1  cell monitor", 0.58, 0.835, { at: 3.6, size: 28, tone: "muted" });
        l.stat("months", 0.1, 0.6, { at: 4.6, dur: 1.2, count: [0, 18], sub: "ahead, ten years in", size: 120 });
        l.link(0.6, 0.585, 0.7, 0.655, { at: 5.6 });
        l.stamp("He sees what hasn't happened yet", 0.5, 0.905, { at: 6.4 });
        l.mark("cross", 0.86, 0.48, { at: 7.4, size: 50 });
        l.finish();
      });
    </script>
  </body>
</html>
