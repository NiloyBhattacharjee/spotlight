<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>reelbot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5E7E"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5E7E"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A1F2B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- a 9:16 reel -->
  <g filter="url(#shadow)">
    <rect x="156" y="84" width="200" height="344" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="226" y="104" width="60" height="10" rx="5" fill="#FFD9C2"/>
  <path d="M232 214 L318 256 L232 298 Z" fill="url(#play)" stroke="url(#play)" stroke-width="16" stroke-linejoin="round"/>
  <!-- progress bar along the bottom of the reel -->
  <rect x="186" y="384" width="140" height="10" rx="5" fill="#FFE3D3"/>
  <rect x="186" y="384" width="88" height="10" rx="5" fill="#FF6F6A"/>
  <!-- the bot's spark -->
  <path d="M392 92 C396 124 404 132 436 136 C404 140 396 148 392 180 C388 148 380 140 348 136 C380 132 388 124 392 92 Z" fill="#FFFFFF"/>
  <path d="M110 344 C112 360 116 364 132 366 C116 368 112 372 110 388 C108 372 104 368 88 366 C104 364 108 360 110 344 Z" fill="#FFFFFF" opacity="0.85"/>
</svg>
