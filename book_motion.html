<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /></head>
  <body style="margin: 0">
    <script type="module">
      // Motion layer that slopcannon --book draws over each animated book reel with mockingbird's `motion`: the
      // book's weather (mist, snow, rain, embers or dust), a soft glow in the sky for some styles, a hook title card,
      // light leaks on each shot change, captions with a pill that follows the voice, vignette and grain.
      // slopcannon fills CONFIG for each reel. Leave the import: motion swaps in the kit.
      import { hash, kit, page, THEMES } from "KIT";

      // ---- settings --------------------------------------------------------
      const THEME = { ...THEMES.night, display: "Segoe UI, sans-serif", serif: "Georgia, serif",
                      accent: "#F4B942", onAccent: "#1A1206" };
      /** title (the hook), sub (book · author, year), shots: seconds where each new illustration comes in,
       *  air: mist | snow | rain | embers | dust | none, glow: a soft light at the top of the frame. */
      const { title: TITLE, sub: SUB, shots: SHOTS, air: AIR, glow: GLOW } =
        /*CONFIG*/{ title: "White Nights", sub: "Fyodor Dostoevsky · 1848", shots: [], air: "mist", glow: true };
      const TITLE_OUT = 3.4;
      // ----------------------------------------------------------------------

      /** Soft flattened fog banks drifting right at different depths, lit with "screen" so they glow. */
      function mist(k, t) {
        const { ctx, W, H, u } = k;
        k.layer(() => {
          ctx.globalCompositeOperation = "screen";
          for (let i = 0; i < 8; i++) {
            const depth = 0.4 + hash(i) * 0.6;
            const r = (380 + 340 * hash(i + 11)) * u;
            const span = W + 2 * r;
            const x = ((hash(i + 5) * span + t * (12 + 26 * depth) * u) % span) - r;
            const y = H * (0.58 + 0.34 * hash(i + 9)) + Math.sin(t * 0.3 + i) * 28 * u;
            const a = (0.07 + 0.08 * depth) * (0.75 + 0.25 * Math.sin(t * 0.5 + i * 1.7));
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(1, 0.38);
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
            g.addColorStop(0, `rgba(205,218,238,${a})`);
            g.addColorStop(1, "rgba(205,218,238,0)");
            ctx.fillStyle = g;
            ctx.fillRect(-r, -r, 2 * r, 2 * r);
            ctx.restore();
          }
        });
      }

      /** A pale lilac-peach glow that breathes at the top of the frame. */
      function skyGlow(k, t) {
        const { ctx, W, H } = k;
        k.layer(() => {
          ctx.globalCompositeOperation = "screen";
          const a = 0.13 + 0.04 * Math.sin(t * 0.25);
          const g = ctx.createLinearGradient(0, 0, 0, H * 0.45);
          g.addColorStop(0, `rgba(255,214,190,${a})`);
          g.addColorStop(0.5, `rgba(196,182,236,${a * 0.5})`);
          g.addColorStop(1, "rgba(196,182,236,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H * 0.45);
        });
      }

      /** Snow drifting down, rain slanting through, or embers rising and flickering, at a few depths. */
      function particles(k, t, kind) {
        const { ctx, W, H, u } = k;
        k.layer(() => {
          if (kind === "embers") ctx.globalCompositeOperation = "lighter";
          for (let i = 0; i < (kind === "rain" ? 140 : 70); i++) {
            const depth = 0.3 + 0.7 * hash(i + 3);
            const travel = t * (kind === "rain" ? 1400 : kind === "snow" ? 90 : 70) * depth * u;
            const y = (((hash(i + 1) * H + (kind === "embers" ? -travel : travel)) % H) + H) % H;
            const drift = kind === "rain" ? -0.25 * travel : Math.sin(t * (0.8 + depth) + i) * 18 * u;
            const x = (((hash(i) * W + drift) % W) + W) % W;
            ctx.beginPath();
            if (kind === "rain") {
              ctx.strokeStyle = `rgba(200,215,235,${0.28 * depth})`;
              ctx.lineWidth = 2 * u * depth;
              ctx.moveTo(x, y);
              ctx.lineTo(x - 10 * u * depth, y + 42 * u * depth);
              ctx.stroke();
            } else {
              const glow = kind === "snow" ? 0.6 * depth : (0.5 + 0.5 * Math.sin(t * 4 + i * 2.1)) * 0.85 * depth;
              ctx.fillStyle = kind === "snow" ? `rgba(255,255,255,${glow})`
                                              : `rgba(255,${(130 + 70 * hash(i + 7)) | 0},60,${glow})`;
              ctx.arc(x, y, (kind === "snow" ? 6 : 3.5) * depth * u, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });
      }

      function draw(ctx, t, m) {
        const k = kit(ctx, t, m, THEME);
        const { W, H } = k;

        if (GLOW) skyGlow(k, t);
        if (AIR === "mist") mist(k, t);
        if (AIR === "dust") k.bokeh({ count: 14, color: "#FFD9A0", opacity: 0.16 });
        if (AIR === "snow" || AIR === "rain" || AIR === "embers") particles(k, t, AIR);

        // A warm light leak as each new illustration dissolves in, kept gentle.
        for (const at of SHOTS) {
          if (Math.abs(t - at) < 1.2) k.layer(() => { ctx.globalAlpha = 0.4; k.leak(at - 0.4, 1.2, ["#FFC98A", "#B9C6FF"]); });
        }

        // Title card over the cold open, for viewers scrolling with the sound off.
        if (t < TITLE_OUT + 0.8) {
          k.scrim({ y: H * 0.3, h: 620 * k.u, strength: 0.55, out: TITLE_OUT + 0.3 });
          k.title({ lines: [[{ text: TITLE, italic: true, weight: 500, family: THEME.serif }]],
                    at: 0.1, out: TITLE_OUT, y: H * 0.28, size: 128, style: "blur", glow: true });
          k.title({ lines: [[{ text: SUB, weight: 600, color: THEME.accent }]],
                    at: 0.6, out: TITLE_OUT, y: H * 0.28 + 130 * k.u, size: 46, style: "rise" });
        }

        k.scrim({ y: H * 0.68, h: 360 * k.u, strength: 0.35 });
        k.captions({ y: H * 0.68, size: 70, upper: false });
        k.vignette(0.55);
        k.grain(0.05);
      }

      page(draw);
    </script>
  </body>
</html>
